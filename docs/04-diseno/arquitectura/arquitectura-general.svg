<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210" font-family="'Work Sans', 'Segoe UI', Arial, sans-serif"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B646F"/></marker></defs><rect width="1400" height="1210" fill="#F9F6F0"/><text x="60" y="52" font-size="30" font-weight="700" fill="#2C3C46" text-anchor="start">Arquitectura de AgroConecta</text><text x="60" y="80" font-size="17" font-weight="400" fill="#5B646F" text-anchor="start">Monolito modular en capas · API REST · frontend estático (cliente-servidor)</text><rect x="60" y="105" width="1280" height="150" rx="12" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.5"/><text x="80" y="135" font-size="15" font-weight="700" fill="#306D35" text-anchor="start">CLIENTE · navegador web (sin aplicación nativa)</text><rect x="80" y="150" width="400" height="88" rx="10" fill="#E7EFE3" stroke="#D3D5C8" stroke-width="1"/><text x="96" y="178" font-size="16" font-weight="700" fill="#2C3C46" text-anchor="start">Celular (360 × 800)</text><text x="96" y="202" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">Agricultor y comprador</text><text x="96" y="224" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">Publicar, buscar, chatear, vender</text><rect x="500" y="150" width="400" height="88" rx="10" fill="#E7EFE3" stroke="#D3D5C8" stroke-width="1"/><text x="516" y="178" font-size="16" font-weight="700" fill="#2C3C46" text-anchor="start">Escritorio (1440 × 900)</text><text x="516" y="202" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">Administrador</text><text x="516" y="224" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">Panel, moderación, precios, usuarios, reclamos</text><rect x="920" y="150" width="400" height="88" rx="10" fill="#F9F6F0" stroke="#D3D5C8" stroke-width="1"/><text x="936" y="178" font-size="16" font-weight="700" fill="#2C3C46" text-anchor="start">Tecnologías</text><text x="936" y="202" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">HTML5 · CSS3 · JavaScript · Bootstrap 5</text><text x="936" y="224" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">js/api.js: JWT en sessionStorage</text><line x1="700" y1="255" x2="700" y2="312" stroke="#5B646F" stroke-width="2" marker-end="url(#flecha)"/><text x="716" y="290" font-size="15" font-weight="600" fill="#5B646F" text-anchor="start">HTTPS · REST / JSON · Authorization: Bearer JWT</text><rect x="60" y="315" width="1280" height="600" rx="12" fill="#FDFDFD" stroke="#306D35" stroke-width="2"/><text x="80" y="345" font-size="15" font-weight="700" fill="#306D35" text-anchor="start">SERVIDOR · Tomcat · un WAR Spring Boot 4.1.1 · Java 21</text><rect x="80" y="362" width="880" height="58" rx="10" fill="#FEF3D6" stroke="#D3D5C8" stroke-width="1"/><text x="98" y="388" font-size="16" font-weight="700" fill="#2C3C46" text-anchor="start">Spring Security · OAuth2 Resource Server · JWT HS256</text><text x="98" y="409" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">Roles con @PreAuthorize · en cada petición el usuario debe seguir ACTIVO (si no, 401)</text><rect x="980" y="362" width="340" height="58" rx="10" fill="#F9F6F0" stroke="#D3D5C8" stroke-width="1"/><text x="998" y="388" font-size="16" font-weight="700" fill="#2C3C46" text-anchor="start">Archivos estáticos (static/)</text><text x="998" y="409" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">pages/&lt;módulo&gt; · js/&lt;módulo&gt; · css</text><rect x="80" y="440" width="400" height="400" rx="10" fill="#F9F6F0" stroke="#D3D5C8" stroke-width="1"/><text x="98" y="468" font-size="17" font-weight="700" fill="#2C3C46" text-anchor="start">Capas de cada módulo</text><rect x="98" y="484" width="364" height="70" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="114" y="508" font-size="16" font-weight="700" fill="#306D35" text-anchor="start">api</text><text x="114" y="528" font-size="14" font-weight="400" fill="#2C3C46" text-anchor="start">Controller REST · Request / Response</text><text x="114" y="546" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">Validación (Bean Validation), sin lógica</text><line x1="280" y1="554" x2="280" y2="572" stroke="#5B646F" stroke-width="2" marker-end="url(#flecha)"/><rect x="98" y="572" width="364" height="70" rx="8" fill="#FDFDFD" stroke="#306D35" stroke-width="2"/><text x="114" y="596" font-size="16" font-weight="700" fill="#306D35" text-anchor="start">aplicacion</text><text x="114" y="616" font-size="14" font-weight="400" fill="#2C3C46" text-anchor="start">Service · Dto</text><text x="114" y="634" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">Casos de uso, reglas, @Transactional</text><line x1="280" y1="642" x2="280" y2="660" stroke="#5B646F" stroke-width="2" marker-end="url(#flecha)"/><rect x="98" y="660" width="364" height="70" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="114" y="684" font-size="16" font-weight="700" fill="#306D35" text-anchor="start">infraestructura</text><text x="114" y="704" font-size="14" font-weight="400" fill="#2C3C46" text-anchor="start">Repository (Spring Data JPA)</text><text x="114" y="722" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">Consultas y bloqueos</text><line x1="280" y1="730" x2="280" y2="748" stroke="#5B646F" stroke-width="2" marker-end="url(#flecha)"/><rect x="98" y="748" width="364" height="70" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="114" y="772" font-size="16" font-weight="700" fill="#306D35" text-anchor="start">dominio</text><text x="114" y="792" font-size="14" font-weight="400" fill="#2C3C46" text-anchor="start">Entidades JPA · enums</text><text x="114" y="810" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">Tablas propias; vistas @Immutable</text><rect x="500" y="440" width="820" height="400" rx="10" fill="#F9F6F0" stroke="#D3D5C8" stroke-width="1"/><text x="518" y="468" font-size="17" font-weight="700" fill="#2C3C46" text-anchor="start">Módulos de negocio (pe.agroconecta)</text><rect x="518" y="484" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="532" y="512" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">catalogo</text><text x="532" y="534" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">catálogos</text><text x="532" y="555" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">distritos, cultivos, unidades</text><text x="532" y="573" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="784" y="484" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="798" y="512" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">usuario</text><text x="798" y="534" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-08</text><text x="798" y="555" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">usuarios, agricultores, compradores</text><text x="798" y="573" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="1050" y="484" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="1064" y="512" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">publicacion</text><text x="1064" y="534" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-01 · RF-03 · RF-07</text><text x="1064" y="555" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">publicaciones</text><text x="1064" y="573" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="518" y="592" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="532" y="620" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">precio</text><text x="532" y="642" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-02</text><text x="532" y="663" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">precios_mercado</text><text x="532" y="681" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="784" y="592" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="798" y="620" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">mensajeria</text><text x="798" y="642" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-04</text><text x="798" y="663" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">conversaciones, mensajes</text><text x="798" y="681" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="1050" y="592" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="1064" y="620" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">venta</text><text x="1064" y="642" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-05 · RF-06 · RF-11</text><text x="1064" y="663" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">transacciones, calificaciones</text><text x="1064" y="681" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="518" y="700" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="532" y="728" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">ventaagrupada</text><text x="532" y="750" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-10</text><text x="532" y="771" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">propuestas_grupales</text><text x="532" y="789" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="784" y="700" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="798" y="728" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">notificacion</text><text x="798" y="750" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-07 (avisos)</text><text x="798" y="771" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">notificaciones</text><text x="798" y="789" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><rect x="1050" y="700" width="250" height="98" rx="8" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.2"/><text x="1064" y="728" font-size="17" font-weight="700" fill="#306D35" text-anchor="start">administracion</text><text x="1064" y="750" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">RF-09</text><text x="1064" y="771" font-size="13" font-weight="400" fill="#5B646F" text-anchor="start">reclamos, suspensiones, panel</text><text x="1064" y="789" font-size="11" font-weight="400" fill="#5B646F" text-anchor="start">api · aplicacion · infraestructura · dominio</text><text x="518" y="826" font-size="13" font-weight="600" fill="#5B646F" text-anchor="start">Entre módulos: solo por la capa aplicacion (Dto) · referencias por id · sin ciclos (ArchUnit)</text><rect x="80" y="856" width="1240" height="44" rx="10" fill="#FEF3D6" stroke="#D3D5C8" stroke-width="1"/><text x="98" y="884" font-size="14" font-weight="600" fill="#2C3C46" text-anchor="start">compartido: seguridad (JWT, VerificadorEstadoUsuario) · error (ErrorResponse, manejador global) · config (OpenAPI, CORS) — sin lógica de negocio</text><line x1="490" y1="915" x2="490" y2="972" stroke="#5B646F" stroke-width="2" marker-end="url(#flecha)"/><text x="506" y="950" font-size="15" font-weight="600" fill="#5B646F" text-anchor="start">JDBC · Hibernate JPA (ddl-auto=validate) · migraciones Flyway V1–V3</text><rect x="60" y="975" width="860" height="175" rx="12" fill="#FDFDFD" stroke="#306D35" stroke-width="2"/><text x="80" y="1005" font-size="15" font-weight="700" fill="#306D35" text-anchor="start">BASE DE DATOS · MariaDB 11 (desarrollo) / MySQL 8 (producción)</text><text x="80" y="1035" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• 20 tablas · 10 vistas · 36 claves foráneas · listas fijas con CHECK</text><text x="80" y="1062" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• 21 triggers: transiciones de estado, línea de tiempo de ventas, reclamos y suspensiones</text><text x="80" y="1089" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• fn_rol_usuario · sp_sincronizar_publicacion</text><text x="80" y="1116" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• Evento diario ev_tareas_diarias (06:00): vence publicaciones, avisos POR_VENCER, cierra propuestas</text><rect x="940" y="975" width="400" height="175" rx="12" fill="#FDFDFD" stroke="#D3D5C8" stroke-width="1.5"/><text x="960" y="1005" font-size="15" font-weight="700" fill="#306D35" text-anchor="start">CALIDAD E INTEGRACIÓN CONTINUA</text><text x="960" y="1035" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• JUnit 5 · Mockito · MockMvc</text><text x="960" y="1059" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• Integración contra MariaDB real</text><text x="960" y="1083" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• ArchUnit (reglas de módulos)</text><text x="960" y="1107" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• JaCoCo ≥ 70 % en cada aplicacion</text><text x="960" y="1131" font-size="15" font-weight="400" fill="#2C3C46" text-anchor="start">• GitHub Actions en cada push y PR</text><text x="60" y="1185" font-size="14" font-weight="400" fill="#5B646F" text-anchor="start">Librerías del curso: Apache POI (Excel), Google Guava, Apache Commons Lang3, Logback · costo cero (solo software libre)</text></svg>
