# Configuracion comun de AgroConecta
spring.application.name=agroconecta
spring.profiles.active=dev

# El esquema lo define SQL (Flyway); Hibernate solo valida (ADR-004)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migraciones: V1 esquema, V2 catalogos (modelo-bd.sql v4)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator: solo /actuator/health
management.endpoints.web.exposure.include=health

# JWT (ADR-003): la clave viene de JWT_SECRET (sin valor por defecto, mínimo 32 bytes)
agroconecta.jwt.secreto=${JWT_SECRET}
agroconecta.jwt.expiracion=PT12H
agroconecta.jwt.emisor=agroconecta

# Primer ADMINISTRADOR: se crea al arrancar solo si no existe ninguno y las tres variables tienen valor
agroconecta.admin-inicial.celular=${ADMIN_CELULAR:}
agroconecta.admin-inicial.nombre=${ADMIN_NOMBRE:}
agroconecta.admin-inicial.contrasena=${ADMIN_PASSWORD:}
