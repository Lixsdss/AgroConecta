# Configuracion comun de AgroConecta
spring.application.name=agroconecta
spring.profiles.active=dev

# El esquema lo define SQL (Flyway); Hibernate solo valida (ADR-004)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migraciones: V1 esquema, V2 catalogos (modelo-bd.sql v4)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator: solo /actuator/health
management.endpoints.web.exposure.include=health
