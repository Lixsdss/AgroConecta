# Pruebas que levantan el contexto de Spring: MariaDB local, base de datos agroconecta_test (sin H2)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agroconecta_test}
spring.datasource.username=${DB_USER:agroconecta_app}
spring.datasource.password=${DB_PASSWORD}

# MariaDB local: MySQL Connector/J no obtiene los metadatos de MariaDB 11+ (INFORMATION_SCHEMA.KEYWORDS
# no tiene la columna RESERVED), asi que el dialecto se fija aqui. En prod (MySQL) se detecta solo.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
