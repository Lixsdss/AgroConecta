<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/usuario/rol.js"></script>
</head>
<body>
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/usuario/ingresar.html" aria-label="Volver">&larr;</a>

    </div>

    <h2 class="ac-titulo">¿Quién es usted?</h2>

    <div role="group" aria-label="Tipo de cuenta">

        </button>
