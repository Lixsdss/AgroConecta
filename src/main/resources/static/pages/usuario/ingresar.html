<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/usuario/ingresar.js"></script>
</head>
<body>
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/index.html" aria-label="Volver">&larr;</a>
        <h1>Ingresar</h1>
    </div>

    <h2 class="ac-titulo">Ingrese a su cuenta</h2>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <form id="formulario" novalidate>
        <div class="mb-3">
            <label class="form-label" for="celular">Número de celular</label>
            <input class="form-control" id="celular" name="celular" type="tel" inputmode="numeric"
                   autocomplete="tel-national" maxlength="11" required>
            <div class="invalid-feedback d-block" data-error-de="celular"></div>
        </div>

        <div class="mb-2">
            <label class="form-label" for="contrasena">Contraseña</label>
            <div class="input-group">
                <input class="form-control" id="contrasena" name="contrasena" type="password"
                       autocomplete="current-password" required>
                <button class="btn btn-outline-primary" type="button" id="mostrar" aria-pressed="false"
                        aria-controls="contrasena">Mostrar</button>
            </div>
            <div class="invalid-feedback d-block" data-error-de="contrasena"></div>
        </div>

        <button class="btn btn-link px-0 mb-3" type="button" id="olvido">¿Olvidó su contraseña?</button>

        <button class="btn btn-primary w-100 mb-3" type="submit" id="enviar">Ingresar</button>
    </form>

    <a class="btn btn-outline-primary w-100" href="/pages/usuario/rol.html">Crear cuenta nueva</a>
</main>
</body>
</html>
