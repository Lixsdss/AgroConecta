<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis ventas · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/venta/historial.js"></script>
</head>
<body>
<!-- Mis ventas / Mis compras (RF-06 / UC-08): en curso y terminadas, filtros y exportación a Excel. -->
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/usuario/inicio.html" aria-label="Volver al inicio"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1 id="titulo">Mis ventas</h1>
    </div>

    <div class="ac-pestanas mb-3" role="tablist" aria-label="Grupos de ventas">
        <button type="button" role="tab" aria-selected="true" data-grupo="EN_CURSO">En curso</button>
        <button type="button" role="tab" aria-selected="false" data-grupo="TERMINADAS">Terminadas</button>
    </div>

    <details class="mb-3" id="caja-filtros">
        <summary class="fw-semibold">Filtrar por fecha o persona</summary>
        <form class="mt-2" id="filtros" novalidate>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label" for="desde">Desde</label>
                    <input class="form-control" id="desde" name="desde" type="date">
                </div>
                <div class="col-6">
                    <label class="form-label" for="hasta">Hasta</label>
                    <input class="form-control" id="hasta" name="hasta" type="date">
                </div>
            </div>
            <label class="form-label" for="contraparte" id="etiqueta-contraparte">Comprador</label>
            <input class="form-control mb-2" id="contraparte" name="contraparte" maxlength="100" autocomplete="off">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary flex-grow-1" type="button" id="limpiar">Limpiar</button>
                <button class="btn btn-primary flex-grow-1" type="submit">Aplicar</button>
            </div>
        </form>
    </details>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>
    <p class="ac-suave mb-2" id="conteo" aria-live="polite"></p>

    <div class="ac-conversaciones" id="lista"></div>

    <div class="ac-vacio" id="vacio" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#handshake"></use></svg>
        <h2 class="h5 mt-2" id="vacio-titulo"></h2>
        <p class="ac-suave" id="vacio-detalle"></p>
        <a class="btn btn-primary" id="vacio-accion"></a>
    </div>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="ver-mas" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
        <span>Ver más</span>
    </button>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="exportar">
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#clipboard-list"></use></svg>
        <span>Exportar a Excel</span>
    </button>
</main>
</body>
</html>
