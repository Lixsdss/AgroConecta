<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis propuestas · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/ventaagrupada/propuestas.js"></script>
</head>
<body>
<!-- Mis propuestas (RF-10 / UC-12 pasos 8–9 y A3): avance, partes, cerrar y cancelar. No está en el diseño. -->
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/ventaagrupada/lotes.html" aria-label="Volver a los lotes"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1>Mis propuestas</h1>
    </div>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <div class="ac-resultados" id="lista" aria-live="polite"></div>

    <div class="ac-vacio" id="vacio" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#layers"></use></svg>
        <h2 class="h5 mt-2">Aún no ha enviado propuestas</h2>
        <p class="ac-suave">Elija un lote y envíe una propuesta conjunta a varios agricultores a la vez.</p>
        <a class="btn btn-primary" href="/pages/ventaagrupada/lotes.html">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#layers"></use></svg>
            <span>Ver lotes agrupados</span>
        </a>
    </div>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="ver-mas" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
        <span>Ver más</span>
    </button>
</main>

<dialog class="ac-dialogo" id="dialogo" aria-labelledby="dialogo-titulo">
    <h2 class="h4" id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-primary flex-grow-1" type="button" id="dialogo-no">No, volver</button>
        <button class="btn btn-danger flex-grow-1" type="button" id="dialogo-si"></button>
    </div>
</dialog>
</body>
</html>
