<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vender · Paso 3 · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/publicacion/paso3.js"></script>
</head>
<body>
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/publicacion/paso2.html" aria-label="Volver al paso 2"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1>Vender mi cosecha</h1>
    </div>
    <p class="ac-progreso">Paso 3 de 3 <span id="guardado" hidden>· Guardado</span></p>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <h2 class="ac-titulo">¿A qué precio?</h2>

    <form id="formulario" novalidate>
        <div class="mb-3">
            <label class="form-label" for="precioUnitario" id="etiqueta-precio">Precio por unidad</label>
            <div class="input-group">
                <span class="input-group-text">S/</span>
                <input class="form-control" id="precioUnitario" name="precioUnitario" type="number"
                       inputmode="decimal" min="0.01" step="0.01" required>
            </div>
            <div class="invalid-feedback d-block" data-error-de="precioUnitario"></div>
        </div>

        <p class="ac-alerta ac-alerta-exito" id="precio-kilo" aria-live="polite" hidden></p>

        <fieldset class="mb-4">
            <legend class="form-label">¿Dónde está su cosecha?</legend>
            <div class="d-flex justify-content-between align-items-center">
                <strong class="d-inline-flex align-items-center gap-2"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#map-pin"></use></svg><span id="distrito-actual">—</span></strong>
                <button class="btn btn-link" type="button" id="cambiar" aria-controls="caja-distrito"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#sliders-horizontal"></use></svg> <span>Cambiar</span></button>
            </div>
            <div class="form-text" id="origen-distrito">Tomado de su perfil.</div>
            <div class="mt-2" id="caja-distrito" hidden>
                <label class="visually-hidden" for="idDistrito">Elija el distrito</label>
                <select class="form-select" id="idDistrito" name="idDistrito"></select>
            </div>
            <div class="invalid-feedback d-block" data-error-de="idDistrito"></div>
        </fieldset>

        <button class="btn btn-primary w-100" type="submit"><span>Revisar y publicar</span> <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-right"></use></svg></button>
    </form>
</main>
</body>
</html>
