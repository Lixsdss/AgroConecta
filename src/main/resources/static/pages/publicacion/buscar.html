<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar productos · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/publicacion/buscar.js"></script>
</head>
<body>
<!-- Buscar (diseño "buscar", RF-03 / UC-03). Pública: se puede buscar sin cuenta. -->
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/" id="volver" aria-label="Volver al inicio"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1>Buscar productos</h1>
    </div>

    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-outline-primary flex-grow-1" type="button" id="abrir-filtros" aria-haspopup="dialog">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#sliders-horizontal"></use></svg>
            <span id="texto-filtros">Filtrar</span>
        </button>
    </div>

    <p class="fw-semibold mb-2" id="etiqueta-orden">Ordenar por</p>
    <div class="ac-chips mb-3" id="orden" role="radiogroup" aria-labelledby="etiqueta-orden"></div>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>
    <p class="ac-suave mb-2" id="conteo" aria-live="polite"></p>

    <div class="ac-resultados" id="resultados"></div>

    <div class="ac-vacio mt-3" id="vacio" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#search-x"></use></svg>
        <h2 class="h5 mt-2">No encontramos productos</h2>
        <p class="ac-suave">Quite un filtro o busque en otra zona.</p>
        <button class="btn btn-outline-primary" type="button" id="quitar-filtros">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#filter-x"></use></svg>
            <span>Quitar filtros</span>
        </button>
    </div>

    <div class="ac-vacio mt-3" id="error" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#wifi-off"></use></svg>
        <h2 class="h5 mt-2">No pudimos cargar los productos</h2>
        <p class="ac-suave" id="error-detalle">Revise su señal de internet e intente otra vez.</p>
        <button class="btn btn-outline-primary" type="button" id="reintentar">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#refresh-cw"></use></svg>
            <span>Intentar otra vez</span>
        </button>
    </div>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="ver-mas" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
        <span>Ver más</span>
    </button>
</main>

<dialog class="ac-dialogo ac-hoja" id="filtros" aria-labelledby="titulo-filtros">
    <form method="dialog" id="form-filtros">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0" id="titulo-filtros">Filtrar</h2>
            <button class="btn btn-link" type="button" id="cerrar-filtros">
                <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#x"></use></svg>
                <span>Cerrar</span>
            </button>
        </div>

        <fieldset class="mb-3">
            <legend class="form-label fw-semibold">Categoría</legend>
            <div class="ac-chips" id="f-cultivo"></div>
        </fieldset>
        <fieldset class="mb-3" id="grupo-variedad" hidden>
            <legend class="form-label fw-semibold">Variedad</legend>
            <div class="ac-chips" id="f-variedad"></div>
        </fieldset>
        <div class="mb-3">
            <label class="form-label fw-semibold" for="f-lugar">Provincia o distrito</label>
            <select class="form-select" id="f-lugar"></select>
        </div>
        <fieldset class="mb-3">
            <legend class="form-label fw-semibold">Fecha de cosecha</legend>
            <div class="ac-chips" id="f-fecha"></div>
        </fieldset>
        <fieldset class="mb-4">
            <legend class="form-label fw-semibold">Unidad</legend>
            <div class="ac-chips" id="f-unidad"></div>
        </fieldset>

        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary flex-grow-1" type="button" id="limpiar">Limpiar</button>
            <button class="btn btn-primary flex-grow-1" type="submit" id="aplicar">Ver resultados</button>
        </div>
    </form>
</dialog>
</body>
</html>
