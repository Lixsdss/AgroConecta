<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar publicación · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/publicacion/confirmar.js"></script>
</head>
<body>
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/publicacion/paso3.html" aria-label="Volver al paso 3"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>

    <button class="btn btn-primary w-100 mb-3" type="button" id="publicar"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#check"></use></svg> <span>Sí, publicar</span></button>
    <a class="btn btn-outline-primary w-100" href="/pages/publicacion/paso1.html"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg> <span>Corregir</span></a>
