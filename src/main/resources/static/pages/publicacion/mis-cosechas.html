<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis ventas · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/publicacion/mis-cosechas.js"></script>
</head>
<body>
<!-- Mis ventas del agricultor (diseño "ventas", RF-07 / UC-09): sus cosechas y las acciones rápidas. -->
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/usuario/inicio.html" aria-label="Volver al inicio"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1>Mis ventas</h1>
    </div>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <section class="ac-alerta ac-alerta-error ac-banner" id="banner" aria-live="polite" hidden>
        <p class="d-flex align-items-center gap-2 fw-bold mb-2"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#triangle-alert"></use></svg><span id="banner-texto"></span></p>
        <div class="d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" type="button" id="banner-precio">Bajar precio</button>
            <button class="btn btn-outline-primary flex-grow-1" type="button" id="banner-extender">Extender</button>
        </div>
    </section>

    <div class="ac-pestanas mb-3" role="tablist" aria-label="Mis cosechas">
        <button type="button" role="tab" aria-selected="true" data-grupo="ACTIVAS">Activas</button>
        <button type="button" role="tab" aria-selected="false" data-grupo="CERRADAS">Vendidas y retiradas</button>
    </div>

    <div class="ac-resultados" id="lista"></div>

    <div class="ac-vacio" id="vacio" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#sprout"></use></svg>
        <h2 class="h5 mt-2" id="vacio-titulo">Aún no tiene ventas</h2>
        <p class="ac-suave">Publique su primera cosecha. Es gratis y toma 2 minutos.</p>
        <a class="btn btn-primary" href="/pages/publicacion/paso1.html">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#sprout"></use></svg>
            <span>Vender mi cosecha</span>
        </a>
    </div>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="ver-mas" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
        <span>Ver más</span>
    </button>

    <a class="btn btn-link w-100 mt-3" href="/pages/venta/historial.html">
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#handshake"></use></svg>
        <span>Ver historial de ventas</span>
    </a>
</main>

<dialog class="ac-dialogo ac-hoja" id="dialogo" aria-labelledby="dialogo-titulo">
    <form id="form-accion" novalidate>
        <h2 class="h4" id="dialogo-titulo"></h2>
        <p class="ac-suave" id="dialogo-detalle"></p>
        <div id="alerta-dialogo" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

        <div class="mb-3" data-campo="precio" hidden>
            <label class="form-label fw-semibold" for="precioUnitario" id="etiqueta-precio">Nuevo precio</label>
            <div class="input-group">
                <span class="input-group-text">S/</span>
                <input class="form-control" id="precioUnitario" name="precioUnitario" type="number" inputmode="decimal" min="0.01" step="0.01">
            </div>
            <div class="form-text" id="precio-kilo"></div>
            <div class="invalid-feedback d-block" data-error-de="precioUnitario"></div>
        </div>

        <fieldset class="mb-3" data-campo="dias" hidden>
            <legend class="form-label fw-semibold">¿Cuántos días más?</legend>
            <div class="ac-chips" id="dias"></div>
            <div class="form-text" id="nueva-fecha"></div>
            <div class="invalid-feedback d-block" data-error-de="dias"></div>
        </fieldset>

        <div data-campo="corregir" hidden>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="cantidad" id="etiqueta-cantidad">Cantidad</label>
                <input class="form-control" id="cantidad" name="cantidad" type="number" inputmode="decimal" min="0.01" step="0.01">
                <div class="invalid-feedback d-block" data-error-de="cantidad"></div>
            </div>
            <div class="mb-3" id="caja-peso">
                <label class="form-label fw-semibold" for="pesoUnidadKg" id="etiqueta-peso">Kilos por unidad</label>
                <input class="form-control" id="pesoUnidadKg" name="pesoUnidadKg" type="number" inputmode="decimal" min="0.001" step="0.001">
                <div class="invalid-feedback d-block" data-error-de="pesoUnidadKg"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="precioCorregido" id="etiqueta-precio-corregido">Precio por unidad</label>
                <div class="input-group">
                    <span class="input-group-text">S/</span>
                    <input class="form-control" id="precioCorregido" name="precioCorregido" type="number" inputmode="decimal" min="0.01" step="0.01">
                </div>
                <div class="invalid-feedback d-block" data-error-de="precioCorregido"></div>
            </div>
        </div>

        <button class="btn btn-primary w-100 mb-2" type="submit" id="confirmar"></button>
        <button class="btn btn-link w-100" type="button" id="cancelar">Volver</button>
    </form>
</dialog>
</body>
</html>
