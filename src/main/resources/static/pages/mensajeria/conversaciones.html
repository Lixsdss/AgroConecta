<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensajes · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/mensajeria/conversaciones.js"></script>
</head>
<body>
<!-- Mensajes (diseño "chats", RF-04): conversaciones del agricultor o del comprador. -->
<main class="ac-pantalla">
    <div class="ac-barra">
        <a class="ac-atras" href="/pages/usuario/inicio.html" aria-label="Volver al inicio"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1>Mensajes</h1>
    </div>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <div class="ac-conversaciones" id="lista" aria-live="polite"></div>

    <div class="ac-vacio" id="vacio" hidden>
        <svg class="ac-icono ac-icono-grande" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#message-circle"></use></svg>
        <h2 class="h5 mt-2">Todavía no tiene mensajes</h2>
        <p class="ac-suave" id="vacio-detalle"></p>
        <a class="btn btn-primary" href="/pages/publicacion/buscar.html" id="vacio-buscar" hidden>
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#search"></use></svg>
            <span>Buscar productos</span>
        </a>
    </div>

    <button class="btn btn-outline-primary w-100 mt-3" type="button" id="ver-mas" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
        <span>Ver más</span>
    </button>
</main>
</body>
</html>
