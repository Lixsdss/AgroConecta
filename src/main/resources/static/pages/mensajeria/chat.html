<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat · AgroConecta</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
    <script type="module" src="/js/mensajeria/chat.js"></script>
</head>
<body>
<!-- Chat (diseño "chat", RF-04 / UC-04): mensajes y ofertas. "Registrar acuerdo" llega con RF-06 (slice 7). -->
<main class="ac-pantalla">
    <div class="ac-barra mb-2">
        <a class="ac-atras" href="/pages/mensajeria/conversaciones.html" aria-label="Volver a Mensajes"><svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#arrow-left"></use></svg></a>
        <h1 id="otra-parte">Chat</h1>
    </div>

    <div id="alerta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>

    <button class="ac-producto-chat" type="button" id="producto" aria-expanded="false" aria-controls="producto-detalle" hidden>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#sprout"></use></svg>
        <span class="flex-grow-1">
            <strong class="d-block" id="producto-titulo"></strong>
            <span class="ac-suave" id="producto-cantidad"></span>
        </span>
        <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#chevron-down"></use></svg>
    </button>
    <div class="ac-tarjeta-precio mt-2" id="producto-detalle" hidden>
        <div class="fw-semibold" id="producto-precio"></div>
        <div class="ac-suave" id="producto-peso"></div>
    </div>
    <p class="ac-alerta ac-alerta-info mt-2" id="no-disponible" hidden>Esta cosecha ya no está disponible para ofertas. Puede seguir escribiendo para coordinar.</p>

    <div class="ac-mensajes" id="mensajes" aria-live="polite" aria-label="Mensajes"></div>

    <div class="ac-escribir">
        <button class="btn btn-outline-primary w-100 mb-2" type="button" id="hacer-oferta" hidden>
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#hand-coins"></use></svg>
            <span>Hacer oferta</span>
        </button>
        <form class="d-flex gap-2" id="form-texto" novalidate>
            <label class="visually-hidden" for="texto">Mensaje</label>
            <input class="form-control" id="texto" name="contenido" maxlength="1000" autocomplete="off" placeholder="Escriba un mensaje">
            <button class="btn btn-primary" type="submit" id="enviar">
                <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#send"></use></svg>
                <span>Enviar</span>
            </button>
        </form>
    </div>
</main>

<dialog class="ac-dialogo ac-hoja" id="dialogo-oferta" aria-labelledby="titulo-oferta">
    <form id="form-oferta" novalidate>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0" id="titulo-oferta">Hacer oferta</h2>
            <button class="btn btn-link" type="button" id="cerrar-oferta">
                <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#x"></use></svg>
                <span>Cerrar</span>
            </button>
        </div>
        <div id="alerta-oferta" class="ac-alerta" role="alert" tabindex="-1" hidden></div>
        <div class="mb-3">
            <label class="form-label" for="ofertaCantidad" id="etiqueta-cantidad">Cantidad</label>
            <input class="form-control" id="ofertaCantidad" name="ofertaCantidad" type="number" inputmode="decimal" min="0.01" step="0.01" required>
            <div class="form-text" id="ayuda-cantidad"></div>
            <div class="invalid-feedback d-block" data-error-de="ofertaCantidad"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="ofertaPrecioUnitario" id="etiqueta-precio">Precio por unidad</label>
            <div class="input-group">
                <span class="input-group-text">S/</span>
                <input class="form-control" id="ofertaPrecioUnitario" name="ofertaPrecioUnitario" type="number" inputmode="decimal" min="0.01" step="0.01" required>
            </div>
            <div class="invalid-feedback d-block" data-error-de="ofertaPrecioUnitario"></div>
        </div>
        <p class="fw-semibold" id="resumen-oferta" aria-live="polite"></p>
        <button class="btn btn-primary w-100" type="submit" id="enviar-oferta">
            <svg class="ac-icono" aria-hidden="true" focusable="false"><use href="/img/iconos.svg#hand-coins"></use></svg>
            <span>Enviar oferta</span>
        </button>
    </form>
</dialog>
</body>
</html>
